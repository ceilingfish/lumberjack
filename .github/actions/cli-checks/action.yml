name: CLI checks
description: Lint and test the Go CLI/daemon, its SQL migrations and protobuf, and publish its lcov report

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2
    - run: |
        if [ -n "${GITHUB_BASE_REF:-}" ]; then
          base="origin/$GITHUB_BASE_REF"
        else
          base="origin/main"
        fi
        mise run cli:format --check --base "$base"
      shell: bash
    - run: mise run cli:coverage
      shell: bash
    - uses: actions/upload-artifact@v4
      with:
        name: coverage-cli
        path: coverage-cli.lcov
