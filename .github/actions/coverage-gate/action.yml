name: Coverage gate
description: Merge the Go and Swift lcov reports and check every package against the per-package floor

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2
    - uses: actions/download-artifact@v4
      with:
        pattern: coverage-*
        merge-multiple: true
    - run: mise run coverage:gate-test
      shell: bash
    - run: mise run coverage:check
      shell: bash
    # Uploaded on failure too — that is when you need the report.
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-merged
        path: coverage.lcov
