name: macOS checks
description: Lint and test the Swift menu-bar app, and publish its lcov report

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2
    - run: mise run osx:format --check
      shell: bash
    - run: mise run osx:coverage
      shell: bash
    - uses: actions/upload-artifact@v4
      with:
        name: coverage-osx
        path: coverage-osx.lcov
