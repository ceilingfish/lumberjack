name: Checks

# The single definition of "the checks". Called by the pull-request workflow
# (ci.yml) and by the release workflow, so a step added here applies to both.
# Split by language so only the Swift half needs a macOS runner.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  cli-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run cli:format-check
      - run: mise run cli:lint
      - run: mise run cli:test
      - run: mise run cli:lcov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: coverage-go.lcov

  osx-checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run osx:format-check
      - run: mise run osx:lint
      - run: mise run osx:test
      - run: mise run osx:lcov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-swift
          path: coverage-swift.lcov

  # The gate covers both codebases, so it needs both halves on one machine. It
  # reports but never blocks: the per-package floor is not met yet (see #6), so
  # making it blocking would block every pull request. Deleting the
  # `continue-on-error` below is the one-line change once the floor is met.
  coverage:
    needs: [cli-checks, osx-checks]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: mise run coverage:gate-test
      - run: mise run coverage:check
      # Uploaded on failure too — that is when you need the report.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: coverage.lcov
