name: Release

# Runs the project's checks on every push to main, then lets release-please
# open/update per-component Release PRs. Merging a Release PR tags that
# component and this workflow (on the resulting push to main) builds and
# publishes its artifacts. See issue #11.
#
# The check steps themselves live in .github/actions/, shared with the
# pull-request pipeline (ci.yml), so a release is never cut from a main that
# would have failed CI.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Split by language so only the Swift half needs a macOS runner.
  cli-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cli-checks

  osx-checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/osx-checks

  # The gate covers both codebases, so it needs both halves on one machine. It
  # is reported but not depended on: the per-package floor is not met yet (see
  # #6), and a release is gated on the tests passing, not on the floor.
  coverage:
    needs: [cli-checks, osx-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/coverage-gate

  release-please:
    needs: [coverage]
    runs-on: ubuntu-latest
    outputs:
      cli_release_created: ${{ steps.release.outputs.release_created }}
      cli_tag_name: ${{ steps.release.outputs.tag_name }}
      macos_release_created: ${{ steps.release.outputs['macos--release_created'] }}
      macos_tag_name: ${{ steps.release.outputs['macos--tag_name'] }}
      macos_version: ${{ steps.release.outputs['macos--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Merging the CLI's Release PR tagged this push `vX.Y.Z` — build and
  # publish darwin/arm64 and darwin/amd64 binaries for it. The CLI is pure Go
  # (sqlite via modernc, no cgo), so both cross-compile on a Linux runner.
  release-cli:
    needs: release-please
    if: ${{ needs.release-please.outputs.cli_release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.cli_tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: jdx/mise-action@v2
      - name: Build darwin/arm64 and darwin/amd64 binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build \
              -ldflags "-X github.com/ceilingfish/lumberjack/internal/cli.Version=${TAG}" \
              -o "dist/lumberjack-darwin-$arch" .
          done
      - name: Attach binaries to the GitHub release
        run: gh release upload "$TAG" dist/lumberjack-darwin-arm64 dist/lumberjack-darwin-amd64
        env:
          GH_TOKEN: ${{ github.token }}

  # Point the in-repo Homebrew tap (HomebrewFormula/lumberjack.rb) at the tag
  # just released. The formula builds from source, so all that changes is the
  # source-tarball url and its sha256 — committed straight to main, which is
  # what `brew tap ceilingfish/lumberjack <repo url>` tracks.
  bump-homebrew-formula:
    needs: [release-please, release-cli]
    if: ${{ needs.release-please.outputs.cli_release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.cli_tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rewrite the formula's url and sha256
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          sed -i \
            -e "s|^  url .*|  url \"$url\"|" \
            -e "s|^  sha256 .*|  sha256 \"$sha\"|" \
            HomebrewFormula/lumberjack.rb
          grep -E '^  (url|sha256) ' HomebrewFormula/lumberjack.rb
      - name: Commit the bump
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "formula already points at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: point Homebrew formula at ${TAG}"
          git push origin main

  # Merging the app's Release PR tagged this push `macos/vX.Y.Z` — build and
  # publish its .dmg for it.
  release-macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.macos_release_created == 'true' }}
    runs-on: macos-15
    env:
      TAG: ${{ needs.release-please.outputs.macos_tag_name }}
      VERSION: ${{ needs.release-please.outputs.macos_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Stamp the released version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" \
            macos/Resources/Info.plist
      - name: Build the .app bundle
        run: macos/scripts/build-app.sh macos/.build/app
      - name: Package the .dmg
        run: macos/scripts/package-dmg.sh macos/.build/app macos/.build/LumberjackMenuBar.dmg
      - name: Attach the .dmg to the GitHub release
        run: gh release upload "$TAG" macos/.build/LumberjackMenuBar.dmg
        env:
          GH_TOKEN: ${{ github.token }}
