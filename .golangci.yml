version: "2"

linters:
  # standard gives: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - revive
    - misspell
    - errorlint
    - bodyclose
  exclusions:
    rules:
      - linters:
          - revive
        text: "^(exported|package-comments):"

formatters:
  enable:
    - gofumpt
