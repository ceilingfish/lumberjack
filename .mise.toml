# Lumberjack tooling, managed by mise-en-place (https://mise.jdx.dev)

[tools]
go = "1.26.5"
gofumpt = "0.9.2"
golangci-lint = "2.12.2"
uv = "0.9.28"
"pipx:sqlfluff" = "3.4.2"
buf = "1.71.0"
"github:gastownhall/beads" = "latest"
# node provides npx, used by the `skills` task to install agent skills.
node = "24.10.0"

# Cobra (github.com/spf13/cobra, v1.10.2) is a Go library dependency, tracked
# in go.mod rather than installed here.

[tasks.build]
description = "Build the lumberjack binary"
run = "go build -o bin/lumberjack ."

# Installs the CLI (to ~/.local/bin) and the daemon (as a login service) from a
# freshly built, durable binary. `install` refuses a `go run` build, so
# installing must go through a real binary — extra args are forwarded (e.g.
# `mise run install -- --cli-only`).
[tasks.install]
description = "Build a durable binary and install the CLI and daemon"
run = "go build -o bin/lumberjack . && ./bin/lumberjack install --force"

[tasks.dev]
description = "Run the CLI from source"
run = "go run ."

# Emits the Cobra shell-completion script for the given shell to stdout, so it
# can be sourced directly. mise appends the trailing shell name as an argument.
# Install (zsh): add to ~/.zshrc  ->  eval "$(mise run shell-completion zsh)"
# Bash/fish/powershell work the same: mise run shell-completion <shell>
[tasks.shell-completion]
description = 'Print the shell completion script, e.g. eval "$(mise run shell-completion zsh)"'
run = "go run . completion"

# The two codebases are formatted, linted and tested independently: `cli:*`
# acts on the Go CLI/daemon, `osx:*` on the Swift menu-bar app under macos/.
# They deliberately share no task — different toolchains, different file sets,
# different failure modes. The one place they meet is `coverage`, which reads
# the profiles `cli:test` and `osx:test` leave behind.

[tasks."cli:test"]
description = "Run the Go test suite, writing the coverage profile `cli:lcov` reads"
run = "go test -covermode=atomic -coverprofile=coverage.out ./..."

[tasks."cli:format"]
description = "Format all Go source with gofumpt"
run = "gofumpt -w ."

# Check-only counterpart to `cli:format`, for CI: fails on a diff instead of
# writing one, so the release workflow never pushes a reformatting commit.
[tasks."cli:format-check"]
description = "Check Go formatting with gofumpt; fails on a diff without writing"
run = "scripts/format-check.sh"

[tasks."cli:lint"]
description = "Run golangci-lint"
run = "golangci-lint run"

# swift-format ships with the Swift 6 toolchain the app already requires (see
# macos/README.md), so linting and formatting Swift adds no new dependency.
[tasks."osx:test"]
description = "Run the Swift test suite, emitting the coverage data `osx:lcov` reads"
run = "scripts/osx-test.sh"

[tasks."osx:format"]
description = "Format all Swift source with swift-format"
dir = "macos"
run = "swift format --in-place --recursive Sources Tests"

# Check-only counterpart to `osx:format`, the parallel of `cli:format-check`.
[tasks."osx:format-check"]
description = "Check Swift formatting with swift-format; fails on a diff without writing"
dir = "macos"
run = "swift format lint --recursive --strict Sources Tests"

[tasks."osx:lint"]
description = "Lint Swift source with swift-format"
dir = "macos"
run = "swift format lint --recursive Sources Tests"

[tasks.format-sql]
description = "Auto-fix SQL migration formatting with sqlfluff"
run = "sqlfluff fix internal/database/migrations"

[tasks.lint-sql]
description = "Lint SQL migrations with sqlfluff"
run = "sqlfluff lint internal/database/migrations"

[tasks.generate]
description = "Generate gRPC stubs from proto/ into pkg/client"
run = "buf generate"

[tasks.format-proto]
description = "Auto-fix protobuf formatting with buf"
run = "buf format -w proto"

[tasks.lint-proto]
description = "Lint protobuf definitions with buf"
run = "buf lint"

[tasks.lint-proto-breaking]
description = "Check protobuf for breaking changes against main"
run = "buf breaking --against '.git#branch=main'"

[tasks."cli:lcov"]
description = "Convert the cli:test Go profile to lcov"
wait_for = ["cli:test"]
run = "scripts/go-lcov.sh"

[tasks."osx:lcov"]
description = "Export the osx:test Swift coverage to lcov"
wait_for = ["osx:test"]
run = "scripts/osx-lcov.sh"

[tasks."coverage:check"]
description = "Merge the Go and Swift lcov reports and check the merged total against the floor"
wait_for = ["cli:lcov", "osx:lcov"]
run = "scripts/coverage.sh 80 coverage-go.lcov coverage-swift.lcov"

[tasks.coverage]
description = "Run both suites and check their merged coverage against the floor"
depends = ["cli:test", "osx:test", "cli:lcov", "osx:lcov", "coverage:check"]

[tasks.skills]
description = "Install agent skills pinned in skills-lock.json"
run = "npx --yes skills experimental_install"
