# Lumberjack tooling, managed by mise-en-place (https://mise.jdx.dev)

[tools]
go = "1.26.5"
gofumpt = "0.9.2"
golangci-lint = "2.12.2"
uv = "0.9.28"
"pipx:sqlfluff" = "3.4.2"
buf = "1.71.0"
"github:gastownhall/beads" = "latest"

# Cobra (github.com/spf13/cobra, v1.10.2) is a Go library dependency, tracked
# in go.mod rather than installed here.

[tasks.build]
description = "Build the lumberjack binary"
run = "go build -o bin/lumberjack ."

[tasks.dev]
description = "Run the daemon in the foreground (development mode)"
run = "go run ."

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.format]
description = "Format all Go source with gofumpt"
run = "gofumpt -w ."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.format-sql]
description = "Auto-fix SQL migration formatting with sqlfluff"
run = "sqlfluff fix internal/database/migrations"

[tasks.lint-sql]
description = "Lint SQL migrations with sqlfluff"
run = "sqlfluff lint internal/database/migrations"

[tasks.generate]
description = "Generate gRPC stubs from proto/ into pkg/client"
run = "buf generate"

[tasks.format-proto]
description = "Auto-fix protobuf formatting with buf"
run = "buf format -w proto"

[tasks.lint-proto]
description = "Lint protobuf definitions with buf"
run = "buf lint"

[tasks.lint-proto-breaking]
description = "Check protobuf for breaking changes against main"
run = "buf breaking --against '.git#branch=main'"

[tasks.coverage]
description = "Run tests with per-file coverage; fail if total is below 80%"
run = "scripts/coverage.sh 80"
